name: Deploy Puzzles Without External Redirects

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/pages-local.yml"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get playable gh-pages site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Remove TwistyMaze redirects
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("site")
          changed = []

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              if path.suffix.lower() not in {".html", ".htm", ".js"}:
                  continue

              raw = path.read_bytes()

              try:
                  text = raw.decode("utf-8")
                  encoding = "utf-8"
              except UnicodeDecodeError:
                  text = raw.decode("latin-1")
                  encoding = "latin-1"

              old = text

              if path.suffix.lower() in {".html", ".htm"}:
                  # Remove inline redirect scripts that mention TwistyMaze.
                  text = re.sub(
                      r"<script\b[^>]*>.*?puzzles\.twistymaze\.com.*?</script\s*>",
                      "",
                      text,
                      flags=re.IGNORECASE | re.DOTALL,
                  )

                  # Remove meta-refresh redirects to TwistyMaze.
                  text = re.sub(
                      r"<meta\b(?=[^>]*puzzles\.twistymaze\.com)[^>]*>",
                      "",
                      text,
                      flags=re.IGNORECASE | re.DOTALL,
                  )

                  # Disable ordinary links to the replacement site.
                  text = re.sub(
                      r"(\bhref\s*=\s*[\"'])https?://puzzles\.twistymaze\.com[^\"']*([\"'])",
                      r"\1#\2",
                      text,
                      flags=re.IGNORECASE,
                  )

              if path.suffix.lower() == ".js":
                  # Neutralize one-line JS redirect statements that directly
                  # contain the replacement-site hostname.
                  lines = []
                  for line in text.splitlines(keepends=True):
                      low = line.lower()
                      if (
                          "puzzles.twistymaze.com" in low
                          and any(word in low for word in (
                              "location", "redirect", "replace(", "assign(",
                              "settimeout", "window.open"
                          ))
                      ):
                          newline = "\n" if line.endswith("\n") else ""
                          lines.append("// TwistyMaze redirect removed by GitHub Pages workflow" + newline)
                      else:
                          lines.append(line)
                  text = "".join(lines)

              # Safety net: any remaining full TwistyMaze URL becomes "#".
              text = re.sub(
                  r"https?://puzzles\.twistymaze\.com(?:/[A-Za-z0-9_./?=&%#:+~-]*)?",
                  "#",
                  text,
                  flags=re.IGNORECASE,
              )

              if text != old:
                  path.write_bytes(text.encode(encoding))
                  changed.append(str(path))

          print("Patched files:")
          for name in changed:
              print(" -", name)

          leftovers = []
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".html", ".htm", ".js"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  text = path.read_text(encoding="latin-1")
              if "puzzles.twistymaze.com" in text.lower():
                  leftovers.append(str(path))

          if leftovers:
              print("\nRemaining textual TwistyMaze references:")
              for name in leftovers:
                  print(" -", name)
          else:
              print("\nNo TwistyMaze hostname references remain.")

          (root / ".nojekyll").touch()
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload cleaned site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
