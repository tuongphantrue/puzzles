name: Deploy Original Puzzles To My GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/pages-local.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download full upstream gh-pages history
        uses: actions/checkout@v4
        with:
          repository: medmunds/puzzles
          ref: gh-pages
          fetch-depth: 0
          path: site

      - name: Find last playable version before TwistyMaze redirects
        shell: bash
        run: |
          set -euo pipefail
          cd site

          CLEAN_COMMIT=""

          # Start from newest and walk backwards until we find a version
          # whose HTML/JS contains no puzzles.twistymaze.com references.
          while IFS= read -r commit; do
            if git grep -I -q \
              -e 'puzzles\.twistymaze\.com' \
              "$commit" -- '*.html' '*.htm' '*.js' 2>/dev/null; then
              continue
            fi

            CLEAN_COMMIT="$commit"
            break
          done < <(git rev-list HEAD)

          if [ -z "$CLEAN_COMMIT" ]; then
            echo "Could not find a pre-TwistyMaze version."
            exit 1
          fi

          echo "Using clean historical commit: $CLEAN_COMMIT"

          # Checkout the original, already-built static puzzle site exactly
          # as it existed before the migration redirects were added.
          git checkout --detach "$CLEAN_COMMIT"

          # Remove Git metadata from the Pages artifact.
          rm -rf .git

          # Do not let Jekyll transform this already-built static site.
          touch .nojekyll

          # Add a simple deployment marker for troubleshooting.
          printf '%s\n' \
            "Hosted by tuongphantrue.github.io/puzzles/" \
            "Historical source commit: $CLEAN_COMMIT" \
            "TwistyMaze migration redirects: not present" \
            > _local-build.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static puzzle site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
