name: Deploy Puzzles Locally

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/pages-local.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get original playable site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Disable external TwistyMaze redirects
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("site")
          changed = []

          # IMPORTANT:
          # Do not remove <script> blocks. Some puzzle startup code lives in
          # the same areas of the page. We only replace external TwistyMaze
          # URLs with "#", leaving all original puzzle JavaScript intact.
          pattern = re.compile(
              rb'https?://puzzles\.twistymaze\.com'
              rb'(?:/[A-Za-z0-9_./?=&%#:+~-]*)?',
              re.IGNORECASE
          )

          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              if path.suffix.lower() not in {".html", ".htm", ".js", ".css"}:
                  continue

              data = path.read_bytes()
              new_data = pattern.sub(b"#", data)

              if new_data != data:
                  path.write_bytes(new_data)
                  changed.append(str(path))

          print("Files with TwistyMaze URLs disabled:")
          for name in changed:
              print(" -", name)

          (root / ".nojekyll").touch()
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
